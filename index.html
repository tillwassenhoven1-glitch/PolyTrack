<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
/* ================= Poly Rush – Kern (Physik, Strecken, Rennen) ================= */
const TILE = 20, LVL = 4, HALF_W = 6, CURB = 0.9, RIDE = 0.55, GRAV = 32;
const MAXV = 60, REV = 16, DRAG = 0.0032, GRIP = 9;

// ---------- Vektoren ----------
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vsc = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vadds = (a, b, s) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = a => Math.hypot(a[0], a[1], a[2]);
const vnorm = a => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
function rotAround(v, ax, ang) {
  const c = Math.cos(ang), s = Math.sin(ang), d = vdot(ax, v), cr = vcross(ax, v);
  return [v[0] * c + cr[0] * s + ax[0] * d * (1 - c), v[1] * c + cr[1] * s + ax[1] * d * (1 - c), v[2] * c + cr[2] * s + ax[2] * d * (1 - c)];
}
function rotBetween(a, b, v, k = 1) {
  const c = vcross(a, b), s = vlen(c), d = vdot(a, b);
  if (s < 1e-7) return v;
  return rotAround(v, vsc(c, 1 / s), Math.atan2(s, d) * k);
}

// ---------- Bauteile ----------
const smooth = t => t * t * (3 - 2 * t);
const LOOP_R = 9;
const straightPath = s => ({ p: [0, 0, -TILE / 2 + s * TILE] });
function arcPath(R, cx, cz) {
  return s => { const a = Math.PI - s * Math.PI / 2; return { p: [cx + R * Math.cos(a), 0, cz + R * Math.sin(a)] }; };
}
function loopPath(dir, R = LOOP_R, L = 2 * TILE) {
  return s => {
    const th = 2 * Math.PI * s;
    return { p: [dir * TILE * (s - 0.5 * Math.sin(th) / (2 * Math.PI)), R * (1 - Math.cos(th)), -TILE / 2 + R * Math.sin(th) + L * (s + Math.sin(th) / (2 * Math.PI))], side: [-1, 0, 0] };
  };
}
// Neigt eine flache Bahn um eine Kante (k = -1: linke Kante bleibt, k = 1: rechte Kante bleibt)
function bankPath(base, phiFn, k) {
  return s => {
    const P = base(s), e = 0.002;
    const a = base(Math.max(0, s - e)).p, b = base(Math.min(1, s + e)).p;
    const f = vnorm(vsub(b, a)), r = vnorm([-f[2], 0, f[0]]), phi = phiFn(s);
    const edge = vadds(P.p, r, k * HALF_W);
    const r2 = [r[0] * Math.cos(phi), -k * Math.sin(phi), r[2] * Math.cos(phi)];
    return { p: vadds(edge, r2, -k * HALF_W), side: r2 };
  };
}
const wallPhi = s => 1.45 * (smooth(clamp(3 * s, 0, 1)) - smooth(clamp(3 * s - 2, 0, 1)));
const bankPhi = s => 0.75 * smooth(clamp(s * 4, 0, 1)) * smooth(clamp((1 - s) * 4, 0, 1));
const longStraight = n => s => ({ p: [0, 0, -TILE / 2 + s * n * TILE] });
const C3 = []; for (let x = 0; x < 3; x++) for (let z = 0; z < 3; z++) C3.push([x, z]);
const ST = [[0, 0, 2, 0], [0, 0, 0, 0]];
const PIECES = {
  road:     { name: 'Gerade', icon: '⬆️', cells: [[0, 0]], ports: ST, path: straightPath, segs: 2 },
  start:    { name: 'Start', icon: '🚦', cells: [[0, 0]], ports: ST, path: straightPath, segs: 2, gate: 'start' },
  cp:       { name: 'Checkpoint', icon: '🟡', cells: [[0, 0]], ports: ST, path: straightPath, segs: 2, gate: 'cp' },
  finish:   { name: 'Ziel', icon: '🏁', cells: [[0, 0]], ports: ST, path: straightPath, segs: 2, gate: 'finish' },
  boost:    { name: 'Booster', icon: '⚡', cells: [[0, 0]], ports: ST, path: straightPath, segs: 2, boost: true },

const PIECE_ORDER = ['road', 'start', 'cp', 'finish', 'boost', 'curve', 'bigcurve', 'slope', 'steep', 'jump', 'loopL', 'loopR', 'wallL', 'wallR', 'bank', 'bigloopL', 'bigloopR', 'tall', 'bump'];

function rotXZ(x, z, r) { const a = r * Math.PI / 2, c = Math.cos(a), s = Math.sin(a); return [x * c + z * s, -x * s + z * c]; }
function toWorld(l, pl) { const [x, z] = rotXZ(l[0], l[2], pl.r); return [x + pl.x * TILE, l[1] + pl.y * LVL, z + pl.z * TILE]; }
function dirWorld(l, pl) { const [x, z] = rotXZ(l[0], l[2], pl.r); return [x, l[1], z]; }
function pieceCells(pl) {
  return PIECES[pl.t].cells.map(([cx, cz]) => { const [x, z] = rotXZ(cx, cz, pl.r); return [Math.round(x + pl.x * 2) / 2, Math.round(z + pl.z * 2) / 2]; });
}

// Mittellinie eines Bauteils (Weltkoordinaten): Punkte mit Vorwärts-, Rechts- und Oben-Vektor
function pieceFrames(pl, segs) {
  const def = PIECES[pl.t]; segs = segs || def.segs; const out = [];
  for (let i = 0; i <= segs; i++) {
    const s = i / segs, e = 0.5 / segs;
    const P = def.path(s);
    const a = def.path(Math.max(0, s - e)).p, b = def.path(Math.min(1, s + e)).p;
    const f = vnorm(vsub(b, a));
    const hint = P.side || [-f[2], 0, f[0]];
    let side = vnorm(vsub(hint, vsc(f, vdot(f, hint))));
    const up = vnorm(vcross(side, f));
    out.push({ p: toWorld(P.p, pl), f: vnorm(dirWorld(f, pl)), r: vnorm(dirWorld(side, pl)), u: vnorm(dirWorld(up, pl)), s });
  }
  return out;
}

// ---------- Dreiecks-Gitter für Raycasts ----------
class TriGrid {
  constructor(tris, pieceIdx, cell = 6) {
    const n = tris.length / 9; this.t = tris; this.n = new Float32Array(n * 3); this.pc = pieceIdx; this.cell = cell;
    this.map = new Map(); this.stamp = new Uint32Array(n); this.cur = 1;
    for (let i = 0; i < n; i++) {
      const o = i * 9, A = [tris[o], tris[o + 1], tris[o + 2]], B = [tris[o + 3], tris[o + 4], tris[o + 5]], C = [tris[o + 6], tris[o + 7], tris[o + 8]];
      const nn = vnorm(vcross(vsub(B, A), vsub(C, A))); this.n.set(nn, i * 3);
      const lo = [0, 1, 2].map(k => Math.floor(Math.min(A[k], B[k], C[k]) / cell)), hi = [0, 1, 2].map(k => Math.floor(Math.max(A[k], B[k], C[k]) / cell));
      for (let x = lo[0]; x <= hi[0]; x++) for (let y = lo[1]; y <= hi[1]; y++) for (let z = lo[2]; z <= hi[2]; z++) {
        const key = this.key(x, y, z); let arr = this.map.get(key); if (!arr) this.map.set(key, arr = []); arr.push(i);
      }
    }
  }
  key(x, y, z) { return ((x + 512) * 1024 + (y + 512)) * 1024 + (z + 512); }
  raycast(o, d, maxT) {
    const c = this.cell, e = [o[0] + d[0] * maxT, o[1] + d[1] * maxT, o[2] + d[2] * maxT];
    const lo = [0, 1, 2].map(k => Math.floor((Math.min(o[k], e[k]) - 0.01) / c)), hi = [0, 1, 2].map(k => Math.floor((Math.max(o[k], e[k]) + 0.01) / c));
    if ((hi[0] - lo[0] + 1) * (hi[1] - lo[1] + 1) * (hi[2] - lo[2] + 1) > 4000) return null;
    const st = ++this.cur; let best = null, bt = maxT; const T = this.t;
    for (let x = lo[0]; x <= hi[0]; x++) for (let y = lo[1]; y <= hi[1]; y++) for (let z = lo[2]; z <= hi[2]; z++) {
      const arr = this.map.get(this.key(x, y, z)); if (!arr) continue;
      for (const i of arr) {
        if (this.stamp[i] === st) continue; this.stamp[i] = st;
        const ni = i * 3; if (this.n[ni] * d[0] + this.n[ni + 1] * d[1] + this.n[ni + 2] * d[2] > -1e-4) continue;
        const q = i * 9;
        const e1x = T[q + 3] - T[q], e1y = T[q + 4] - T[q + 1], e1z = T[q + 5] - T[q + 2];
        const e2x = T[q + 6] - T[q], e2y = T[q + 7] - T[q + 1], e2z = T[q + 8] - T[q + 2];
        const px = d[1] * e2z - d[2] * e2y, py = d[2] * e2x - d[0] * e2z, pz = d[0] * e2y - d[1] * e2x;
        const det = e1x * px + e1y * py + e1z * pz; if (Math.abs(det) < 1e-9) continue;
        const inv = 1 / det, tx = o[0] - T[q], ty = o[1] - T[q + 1], tz = o[2] - T[q + 2];
        const u = (tx * px + ty * py + tz * pz) * inv; if (u < 0 || u > 1) continue;
        const qx = ty * e1z - tz * e1y, qy = tz * e1x - tx * e1z, qz = tx * e1y - ty * e1x;
        const v = (d[0] * qx + d[1] * qy + d[2] * qz) * inv; if (v < 0 || u + v > 1) continue;
        const t = (e2x * qx + e2y * qy + e2z * qz) * inv;
        if (t >= 0 && t < bt) { bt = t; best = i; }
      }
    }
    if (best === null) return null;
    return { t: bt, p: vadds(o, d, bt), n: [this.n[best * 3], this.n[best * 3 + 1], this.n[best * 3 + 2]], piece: this.pc[best] };
  }
}

// ---------- Strecke bauen ----------
// Farbindizes: 0 Straße, 1 Randstein A, 2 Randstein B, 3 Seite, 4 Unterseite, 5 Boost, 6 Start/Ziel-Linie hell, 7 Linie dunkel
function buildTrack(track) {
  const phys = [], physPc = [], vis = [], visC = [], gates = [], pillars = [], guides = {};
  let start = null, minY = 0, cpCount = 0;
  const bounds = { x0: 1e9, x1: -1e9, z0: 1e9, z1: -1e9 };
  const tri = (A, B, C, ci) => { vis.push(...A, ...B, ...C); visC.push(ci, ci, ci); };
  const quad = (A, B, C, D, ci) => { tri(A, B, C, ci); tri(B, D, C, ci); };
  const offs = [-HALF_W, -HALF_W + CURB, HALF_W - CURB, HALF_W];
  track.pieces.forEach((pl, idx) => {
    const def = PIECES[pl.t]; if (!def) return;
    const fr = pieceFrames(pl);
    const TH = 1.2;
    for (let i = 0; i < fr.length; i++) {
      const F = fr[i];
      F.pts = offs.map(o => vadds(F.p, F.r, o));
      F.bot = [vadds(vadds(F.p, F.r, -HALF_W), F.u, -TH), vadds(vadds(F.p, F.r, HALF_W), F.u, -TH)];
      bounds.x0 = Math.min(bounds.x0, F.p[0]); bounds.x1 = Math.max(bounds.x1, F.p[0]);
      bounds.z0 = Math.min(bounds.z0, F.p[2]); bounds.z1 = Math.max(bounds.z1, F.p[2]);
      minY = Math.min(minY, F.p[1]);
    }
    for (let i = 0; i < fr.length - 1; i++) {
      const a = fr[i], b = fr[i + 1];
      const alt = (Math.floor(i * 8 / (def.segs || 1)) + idx) % 2 ? 1 : 2;
      for (let k = 0; k < 3; k++) {
        const ci = k === 1 ? 0 : (def.segs <= 2 ? (k === 0 ? 1 : 2) : alt);
        // linke Kante = -rechts. Reihenfolge so, dass Normale = oben
        quad(a.pts[k], a.pts[k + 1], b.pts[k], b.pts[k + 1], ci);
        phys.push(...a.pts[k], ...a.pts[k + 1], ...b.pts[k], ...a.pts[k + 1], ...b.pts[k + 1], ...b.pts[k]); physPc.push(idx, idx);
      }
      quad(a.pts[0], a.bot[0], b.pts[0], b.bot[0], 3);
      quad(a.bot[1], a.pts[3], b.bot[1], b.pts[3], 3);
      quad(a.bot[0], a.bot[1], b.bot[0], b.bot[1], 4);
    }
    // Stirnseiten
    const capA = fr[0], capB = fr[fr.length - 1];
    quad(capA.pts[3], capA.pts[0], capA.bot[1], capA.bot[0], 3);
    quad(capB.pts[0], capB.pts[3], capB.bot[0], capB.bot[1], 3);
    // Markierungen
    const mid = def.gate === 'start' ? pieceFrames(pl, 20)[3] : pieceFrames(pl, 2)[1];
    if (def.boost) {
      for (let k = -1; k <= 1; k++) {
        const c = vadds(vadds(mid.p, mid.f, k * 5), mid.u, 0.03);
        const tip = vadds(c, mid.f, 1.8), l = vadds(vadds(c, mid.r, -3), mid.f, -1), r = vadds(vadds(c, mid.r, 3), mid.f, -1);
        const l2 = vadds(l, mid.f, -1.2), r2 = vadds(r, mid.f, -1.2), tip2 = vadds(tip, mid.f, -1.2);
        quad(tip, l, tip2, l2, 5); quad(r, tip, r2, tip2, 5);
      }
    }
    if (def.gate) {
      const n = 8;
      for (let k = 0; k < n; k++) for (let row = 0; row < 2; row++) {
        const x0 = -HALF_W + CURB + k * (2 * (HALF_W - CURB) / n), x1 = x0 + 2 * (HALF_W - CURB) / n;
        const z0 = -0.8 + row * 0.8, z1 = z0 + 0.8;
        const P = (x, z) => vadds(vadds(vadds(mid.p, mid.r, x), mid.f, z), mid.u, 0.03);
        const ci = def.gate === 'finish' || def.gate === 'start' ? ((k + row) % 2 ? 6 : 7) : 6;
        if (def.gate === 'cp' && row === 1) continue;
        quad(P(x0, z0), P(x1, z0), P(x0, z1), P(x1, z1), ci);
      }
      const g = { type: def.gate, p: mid.p, f: mid.f, r: mid.r, u: mid.u, piece: idx, id: idx };
      gates.push(g);
      if (def.gate === 'cp') cpCount++;
      if (def.gate === 'start' && !start) { const sp = pieceFrames(pl, 20)[14]; start = { p: sp.p, f: sp.f, u: sp.u }; }
    }
    if (def.guide) guides[idx] = pieceFrames(pl, 140);
    if (!def.guide) {
      for (const k of [0, 0.5, 1]) { const F = fr[Math.round(k * (fr.length - 1))]; if (F.u[1] > 0.8 && F.p[1] > 1.6) pillars.push({ p: vadds(F.p, F.u, -1.2), h: F.p[1] - 1.2 }); }
    }
  });
  return {
    grid: new TriGrid(new Float32Array(phys), Int32Array.from(physPc)),
    vis: new Float32Array(vis), visC: Uint8Array.from(visC), gates, pillars, start, cpCount, minY, bounds, guides, pieces: track.pieces,
  };
}

// ---------- Auto-Physik ----------
const WHEELS = [[0.95, 1.35], [-0.95, 1.35], [0.95, -1.35], [-0.95, -1.35]];
function createCar() { return { drifting: false, p: [0, 0, 0], v: [0, 0, 0], f: [0, 0, 1], u: [0, 1, 0], n: [0, 1, 0], grounded: false, steer: 0, noLand: 0, piece: -1, airT: 0, onBoost: false }; }
function placeCar(car, p, f, u, speed = 0) {
  car.u = u.slice(); car.n = u.slice(); car.f = vnorm(f); car.p = vadds(p, u, RIDE); car.v = vsc(car.f, speed);
  car.grounded = true; car.steer = 0; car.noLand = 0; car.airT = 0; car.piece = -1;
}
function probe(car, W, extra, u = car.u, need = 2) {
  const r = vnorm(vcross(car.f, u)); let n = [0, 0, 0], g = [0, 0, 0], hits = 0, piece = -1;
  const down = vsc(u, -1);
  for (const [ox, oz] of WHEELS) {
    const o = vadds(vadds(vadds(car.p, r, ox), car.f, oz), u, 1.0);
    const h = W.grid.raycast(o, down, 1.0 + RIDE + extra);
    if (h) { hits++; n = vadd(n, h.n); g = vadd(g, h.p); piece = h.piece; }
  }
  if (hits < need) {
    if (car.p[1] < RIDE + 1.0 + extra && u[1] > 0.5) return { n: [0, 1, 0], g: [car.p[0], 0, car.p[2]], piece: -2 };
    return null;
  }
  return { n: vnorm(n), g: vsc(g, 1 / hits), piece };
}
function land(car, n, piece) {
  car.grounded = true; car.n = n; car.piece = piece; car.airT = 0;
  const vn = vdot(car.v, n); if (vn < 0) car.v = vadds(car.v, n, -vn);
  let f = vsub(car.f, vsc(n, vdot(car.f, n)));
  if (vlen(f) < 0.2) f = vsub(car.v, vsc(n, vdot(car.v, n)));
  car.f = vnorm(f); car.u = n.slice();
}
function stepCar(car, W, inp, dt) {
  car.steer += clamp(inp.steer - car.steer, -dt * 7, dt * 7);
  car.onBoost = false; if (!car.grounded) car.drifting = false;
  if (car.noLand > 0) car.noLand -= dt;
  if (car.grounded) {
    const n = car.n; let f = car.f, v = vadds(car.v, [0, -GRAV, 0], dt);
    const vf = vdot(v, f), def = PIECES[(W.pieces[car.piece] || {}).t] || {};
    let acc = 0;
    if (inp.throttle > 0) acc += inp.throttle * (vf < 0 ? 40 : 30 * (1 - clamp(vf / MAXV, 0, 1)));
    if (inp.brake > 0) acc -= inp.brake * (vf > 0.5 ? 48 : (vf > -REV ? 22 : 0));
    if (def.boost && vf < 85) { acc += 55; car.onBoost = true; }
    if (car.piece === -2) acc -= vf * 2.5;
    acc -= DRAG * vf * Math.abs(vf);
    let nvf = vf + acc * dt;
    if (!inp.throttle && !inp.brake) nvf = Math.abs(nvf) < 3 * dt ? 0 : nvf - Math.sign(nvf) * 3 * dt;
    v = vadds(v, f, nvf - vf);
    const sp = Math.abs(nvf);
    const drifting = !!inp.drift && sp > 12 && nvf > 0;
    car.drifting = drifting;
    const turn = car.steer * (2.4 - 1.0 * Math.min(1, sp / 55)) * Math.min(1, sp / 5) * (nvf >= 0 ? 1 : -1) * (drifting ? 1.55 : 1);
    const ang = -turn * dt;
    f = rotAround(f, n, ang); v = rotAround(v, n, ang * (drifting ? 0.5 : 0.92));
    let r = vnorm(vcross(f, n));
    const before = vlen(v), vl = vdot(v, r);
    v = vadds(v, r, vl * Math.exp(-(drifting ? 1.7 : GRIP) * dt) - vl);
    const after = vlen(v);
    if (after > 1) v = vsc(v, (after + (before - after) * (drifting ? 0.6 : 0.8)) / after);
    if (drifting) v = vsc(v, 1 - 0.12 * dt);
    // Looping-Führung
    const gd = W.guides[car.piece];
    if (gd) {
      let bi = 0, bd = 1e9;
      for (let i = 0; i < gd.length; i++) { const d = vlen(vsub(gd[i].p, car.p)); if (d < bd) { bd = d; bi = i; } }
      const G = gd[bi]; let t = G.f; if (vdot(t, f) < 0) t = vsc(t, -1);
      t = vnorm(vsub(t, vsc(n, vdot(t, n))));
      f = vnorm(vadds(f, vsub(t, f), Math.min(1, 10 * dt)));
      const rr = vnorm(vcross(t, n)), off = vdot(vsub(car.p, G.p), rr), vlat = vdot(v, rr);
      v = vadds(v, rr, -vlat * Math.min(1, 6 * dt) - off * 2.5 * dt);
    }
    const vn = vdot(v, n);
    const speed = vlen(v);
    if (def.launch && sp > 22 && f[1] < -0.06 && car.noLand <= 0) { car.grounded = false; car.noLand = 0.12; car.v = vadds(v, n, -vn + 1.5); car.f = f; car.p = vadds(car.p, car.v, dt); return; }
    if (vn > 7 || (n[1] < -0.2 && speed < 13) || (n[1] < 0.15 && speed < 11)) {
      car.grounded = false; car.noLand = 0.3; car.v = v; car.f = f; car.p = vadds(car.p, v, dt); return;
    }
    v = vadds(v, n, -vn);
    car.p = vadds(car.p, v, dt);
    car.f = f;
    const h = probe(car, W, 1.0, n, 1);
    if (h) {
      v = rotBetween(n, h.n, v); f = rotBetween(n, h.n, f);
      const d = vdot(vsub(car.p, h.g), h.n); car.p = vadds(car.p, h.n, RIDE - d);
      car.n = h.n; car.u = h.n.slice(); car.piece = h.piece;
      car.f = vnorm(vsub(f, vsc(h.n, vdot(f, h.n)))); car.v = v;
    } else { car.grounded = false; car.v = v; car.airT = 0; }
  } else {
    car.airT += dt;
    let v = vadds(car.v, [0, -GRAV, 0], dt);
    // aufrichten + Luftsteuerung
    const up = [0, 1, 0], ax = vcross(car.u, up), s = vlen(ax);
    if (s > 1e-4) { const a = Math.atan2(s, vdot(car.u, up)) * Math.min(1, 2.2 * dt); const axn = vsc(ax, 1 / s); car.u = vnorm(rotAround(car.u, axn, a)); car.f = vnorm(rotAround(car.f, axn, a)); }
    else if (vdot(car.u, up) < 0) { car.u = vnorm(rotAround(car.u, vnorm(vcross(car.f, car.u)), 2.2 * dt)); }
    car.f = vnorm(rotAround(car.f, car.u, -car.steer * 1.8 * dt));
    car.f = vnorm(vsub(car.f, vsc(car.u, vdot(car.f, car.u))));
    car.v = v;
    const disp = vsc(v, dt), len = vlen(disp);
    if (car.noLand <= 0 && len > 1e-6) {
      const dir = vsc(disp, 1 / len);
      const h = W.grid.raycast(car.p, dir, len + RIDE);
      if (h && vdot(h.n, dir) < 0 && h.n[1] > -0.3) { car.p = vadds(h.p, h.n, RIDE); land(car, h.n, h.piece); return; }
    }
    car.p = vadd(car.p, disp);
    if (car.noLand <= 0) {
      const h = probe(car, W, 0.3);
      if (h && vdot(car.v, h.n) <= 1) { const d = vdot(vsub(car.p, h.g), h.n); car.p = vadds(car.p, h.n, RIDE - d); land(car, h.n, h.piece); }
    }
  }
}

// ---------- Rennen ----------
const DT = 1 / 120;
function createRace(W) {

    else if (tok === 'BL') put('bigcurve', 1, 0);
    else if (tok === 'BR') put('bigcurve', 3, 0);
    else if (tok === 'U') put('slope', 0, 1);
    else if (tok === 'D') put('slope', 0, -1);
    else if (tok === 'UU') put('steep', 0, 2);
    else if (tok === 'DD') put('steep', 0, -2);
    else if (tok === 'OL') put('loopL', 0, 0);
    else if (tok === 'OR') put('loopR', 0, 0);
    else if (tok === 'C') put('cp', 0, 0);
    else if (tok === 'WL') put('wallL', 0, 0);
    else if (tok === 'WR') put('wallR', 0, 0);
    else if (tok === 'KL') put('bank', 1, 0);
    else if (tok === 'KR') put('bank', 3, 0);
    else if (tok === 'GL') put('bigloopL', 0, 0);
    else if (tok === 'GR') put('bigloopR', 0, 0);
    else if (tok === 'TU') put('tall', 0, 4);

function updateRace(dt) {
  const R = G.R, car = R.car;

    } else {

  const tGhost = G.phase === 'run' ? R.t : 0;
  for (const gh of G.ghosts) sampleGhost(gh.data, tGhost, gh.mesh);
  updateChaseCam(G.car.position, car, dt);
  updateSmoke(dt);
  $('#driftTag').classList.toggle('hidden', !(car.drifting && car.grounded));
  driftSound(car.drifting && car.grounded && !paused && mode === 'race');
  // HUD
  $('#time').textContent = fmt(R.finished ? R.finishTime : R.t);
  $('#cpInfo').textContent = G.W.cpCount ? '🟡 ' + R.cps.size + ' / ' + G.W.cpCount : '';
  $('#speed').innerHTML = Math.round(Math.abs(vlen(car.v)) * 3.6) + '<small>km/h' + (car.onBoost ? ' ⚡' : '') + '</small>';
  if (G.splitT > 0) { G.splitT -= dt; if (G.splitT <= 0) $('#split').classList.add('hidden'); }
  if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) $('#msg').textContent = ''; }
  engineSound(sp, !paused && mode === 'race', G.lastInp ? G.lastInp.throttle : 0);
  if (R.finished && mode === 'race') { G.finT += dt; if (G.finT > 1.1) showFinish(); }
}
function onRaceEvent(e) {

    const b = G.bestSplits && G.bestSplits[e.n - 1];

    else s.textContent = fmt(e.time);

  } else if (e.type === 'finish') {
    beep(784, 0.12, 'square', 0.1); beep(988, 0.12, 'square', 0.1, 0.12); beep(1318, 0.35, 'square', 0.1, 0.24);
    G.finT = 0; G.rec.push(...G.R.car.p, G.curQ.x, G.curQ.y, G.curQ.z, G.curQ.w);
    s.classList.remove('hidden', 'better', 'worse'); s.textContent = '🏁 ' + fmt(e.time) + (G.best != null ? '  ' + fmtDiff(e.time - G.best) : '');

function updateChaseCam(pos, car, dt) {
  const f = new THREE.Vector3(...car.f), u = new THREE.Vector3(...car.u);
  const k = camState.snap ? 1 : 1 - Math.exp(-6 * dt);
  camState.up.lerp(u, camState.snap ? 1 : 1 - Math.exp(-3 * dt)).normalize();
  const U = camState.up, speed = vlen(car.v);
  let want, look;
  if (settings.cam === 2) { want = pos.clone().addScaledVector(U, 1.25).addScaledVector(f, 0.4); look = pos.clone().addScaledVector(f, 20).addScaledVector(U, 1.0); camState.pos.copy(want); }
  else {
    const back = settings.cam === 1 ? 13 : 8.5, high = settings.cam === 1 ? 5.5 : 3.2;
    want = pos.clone().addScaledVector(f, -back).addScaledVector(U, high);
    camState.pos.lerp(want, settings.cam === 1 ? k : 1 - Math.exp(-9 * dt));
    if (camState.snap) camState.pos.copy(want);
    look = pos.clone().addScaledVector(f, 4).addScaledVector(U, 1.2);
  }
  camera.position.copy(camState.pos); camera.up.copy(U); camera.lookAt(look);
  const fov = 68 + Math.min(22, speed * 0.28); if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, 4 * dt); camera.updateProjectionMatrix(); }
  placeSun(pos);
  camState.snap = false;
}

function updateMenuScene(dt) {

  const p = menuCar.position, a = menuT * 0.15;

}

// ---------- Einstellungen ----------

const keyLabel = c => ({ ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Space: 'Leertaste', ShiftLeft: 'Shift links', ShiftRight: 'Shift rechts', ControlLeft: 'Strg links', Backspace: '⌫ Rücktaste', Enter: 'Enter', Escape: 'Esc' }[c] || c.replace(/^Key/, '').replace(/^Digit/, ''));

// ---------- Editor ----------
const ED = { track: store.get('edDraft', null) || { name: 'Meine Strecke', env: 'summer', sun: 45, pieces: [] }, sel: 'road', rot: 0, level: 0, fine: false, del: false, undo: [], redo: [], hover: null, cam: { x: 0, z: 0, dist: 120, yaw: 0.7, pitch: 0.9 }, active: false };
function edNewTrack() { ED.track = { name: 'Meine Strecke', env: 'summer', sun: 45, pieces: [{ t: 'start', x: 0, z: 0, y: 0, r: 0 }, { t: 'road', x: 0, z: 1, y: 0, r: 0 }, { t: 'finish', x: 0, z: 2, y: 0, r: 0 }] }; ED.undo = []; ED.redo = []; ED.cam.x = 0; ED.cam.z = 20; }
if (!ED.track.pieces.length) edNewTrack();
let edGrid = null, edPreview = null, edTrackGrp = null;
function openEditor(keep) {
  endRace(); mode = 'editor'; show(null); setHud(false); $('#editorUI').classList.remove('hidden'); ED.active = true; document.body.classList.add('editing');
  if (menuCar) { scene.remove(menuCar); menuCar = null; }
  menuTrack = null;
  $('#edName').value = ED.track.name; $('#edEnv').value = ED.track.env; $('#edSun').value = ED.track.sun;
  const bar = $('#edBar'); bar.innerHTML = '';
  PIECE_ORDER.forEach((t, i) => {

    b.onclick = () => { ED.sel = t; ED.del = false; openEditorBar(); edPreviewBuild(); }; bar.appendChild(b);
  });
  edRebuild(true); edPreviewBuild(); edInfo();
}
function openEditorBar() { [...$('#edBar').children].forEach((b, i) => b.classList.toggle('sel', PIECE_ORDER[i] === ED.sel && !ED.del)); $('#edDel').classList.toggle('on', ED.del); $('#edFine').classList.toggle('on', ED.fine); edInfo(); }
function edLeave() { document.body.classList.remove('editing'); if (!ED.active) return; ED.active = false; $('#editorUI').classList.add('hidden'); for (const o of [edGrid, edPreview]) if (o) scene.remove(o); edGrid = edPreview = null; }
function edInfo() {
  $('#edInfo').innerHTML = '<b>' + (ED.del ? '❌ Löschen' : PIECES[ED.sel].icon + ' ' + PIECES[ED.sel].name) + '</b> · Höhe ' + ED.level + ' · ' + ['↑', '→', '↓', '←'][ED.rot] + (ED.fine ? ' · feines Raster' : '') + '<br>Teile: ' + ED.track.pieces.length +
    '<div class="keys">Klick setzen · X / Shift+Klick löschen<br>R/Leertaste drehen · Q/E Höhe · G Raster<br>WASD verschieben · Rechtsklick ziehen = Kamera<br>Mausrad zoomen · T Testfahrt · Strg+Z/Y</div>';
}
function edSnapshot() { ED.undo.push(JSON.stringify(ED.track.pieces)); if (ED.undo.length > 200) ED.undo.shift(); ED.redo = []; }
function edUndo() { if (!ED.undo.length) return toast('Nichts rückgängig zu machen', 900); ED.redo.push(JSON.stringify(ED.track.pieces)); ED.track.pieces = JSON.parse(ED.undo.pop()); edRebuild(); }
function edRedo() { if (!ED.redo.length) return; ED.undo.push(JSON.stringify(ED.track.pieces)); ED.track.pieces = JSON.parse(ED.redo.pop()); edRebuild(); }
function edRebuild(full) {
  store.set('edDraft', ED.track);
  const W = buildTrack(ED.track);
  if (W.bounds.x0 > W.bounds.x1) W.bounds = { x0: -40, x1: 40, z0: -40, z1: 40 };
  if (full || !worldGrp || ED.lastEnv !== ED.track.env) { loadScene(ED.track, W, false); ED.lastEnv = ED.track.env; }
  else { if (trackGrp) scene.remove(trackGrp); trackGrp = buildTrackMesh(W, ED.track.env); scene.add(trackGrp); setEnv(ED.track.env, ED.track.sun); }
  if (edGrid) scene.remove(edGrid);
  edGrid = new THREE.GridHelper(TILE * 60, ED.fine ? 120 : 60, 0xffffff, 0xffffff); edGrid.material.transparent = true; edGrid.material.opacity = 0.22; edGrid.material.depthWrite = false;
  edGrid.position.y = ED.level * LVL + 0.08;
  scene.add(edGrid); edInfo();
}
function edPreviewBuild() {
  if (edPreview) scene.remove(edPreview); edPreview = null;
  if (!ED.hover) return;
  if (ED.del) {
    const t = edFindAt(ED.hover); if (t < 0) return;
    edPreview = buildTrackMesh(buildTrack({ pieces: [ED.track.pieces[t]] }), 'summer', { ghost: 0xff3333 });
  } else {
    const pl = { t: ED.sel, x: ED.hover.x, z: ED.hover.z, y: ED.level, r: ED.rot };
    edPreview = buildTrackMesh(buildTrack({ pieces: [pl] }), 'summer', { ghost: 0x44ff88 });
    edPreview.position.y = 0.05;
  }
  scene.add(edPreview);
}
function edFindAt(h) {
  let best = -1, bd = 1e9;
  ED.track.pieces.forEach((p, i) => { if (pieceCells(p).some(([x, z]) => Math.abs(x - h.x) < 0.3 && Math.abs(z - h.z) < 0.3)) { const d = Math.abs(p.y - ED.level); if (d < bd) { bd = d; best = i; } } });
  return best;
}
function edPlace() {
  if (!ED.hover) return;
  if (ED.del) { const i = edFindAt(ED.hover); if (i < 0) return; edSnapshot(); ED.track.pieces.splice(i, 1); beep(220, 0.08, 'square', 0.05); }
  else {
    const pl = { t: ED.sel, x: ED.hover.x, z: ED.hover.z, y: ED.level, r: ED.rot };
    const same = ED.track.pieces.findIndex(p => p.t === pl.t && p.x === pl.x && p.z === pl.z && p.y === pl.y && p.r === pl.r); if (same >= 0) return;
    edSnapshot();
    if (pl.t === 'start') ED.track.pieces = ED.track.pieces.filter(p => p.t !== 'start');
    ED.track.pieces.push(pl); beep(660, 0.06, 'triangle', 0.06);

}
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function edHoverFrom(cx, cy) {
  mouse.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -ED.level * LVL), p = new THREE.Vector3();
  if (!ray.ray.intersectPlane(plane, p)) { ED.hover = null; return; }
  const st = ED.fine ? 0.5 : 1;
  const h = { x: Math.round(p.x / TILE / st) * st, z: Math.round(p.z / TILE / st) * st };
  if (!ED.hover || h.x !== ED.hover.x || h.z !== ED.hover.z) { ED.hover = h; edPreviewBuild(); }
}
// Maus / Touch im Editor
const ptrs = new Map(); let drag = null;
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
renderer.domElement.addEventListener('pointerdown', e => {
  if (mode !== 'editor') return;
  renderer.domElement.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  drag = { x: e.clientX, y: e.clientY, btn: e.button, moved: 0, shift: e.shiftKey, type: e.pointerType, pinch: ptrs.size > 1 };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; drag.pd = Math.hypot(a.x - b.x, a.y - b.y); drag.pinch = true; }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (mode !== 'editor') return;
  if (e.pointerType === 'mouse' || !drag) edHoverFrom(e.clientX, e.clientY);
  if (!drag || !ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); const dx = e.clientX - prev.x, dy = e.clientY - prev.y; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 2 && drag.pd) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); ED.cam.dist = Math.max(25, Math.min(400, ED.cam.dist * drag.pd / d)); drag.pd = d; return; }
  if (drag.btn === 2 || drag.btn === 1) { ED.cam.yaw -= dx * 0.006; ED.cam.pitch = Math.max(0.25, Math.min(1.45, ED.cam.pitch + dy * 0.005)); }
  else if (drag.type !== 'mouse' && drag.moved > 12) { const s = ED.cam.dist / 600; edPanRaw(-dx * s, dy * s); }
});
function edPanRaw(rx, fz) {
  // rechts / vorwärts relativ zur Kamera
  const y = ED.cam.yaw;
  ED.cam.x += Math.cos(y) * rx - Math.sin(y) * fz; ED.cam.z += -Math.sin(y) * rx - Math.cos(y) * fz;
}
renderer.domElement.addEventListener('pointerup', e => {
  if (mode !== 'editor') return;
  ptrs.delete(e.pointerId);
  if (drag && !drag.pinch && drag.moved < 10 && drag.btn === 0) {
    if (e.pointerType !== 'mouse') edHoverFrom(e.clientX, e.clientY);
    if (drag.shift) { const d = ED.del; ED.del = true; edPlace(); ED.del = d; } else edPlace();
  }
  if (ptrs.size === 0) drag = null;
});
renderer.domElement.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); if (!ptrs.size) drag = null; });
renderer.domElement.addEventListener('wheel', e => { if (mode !== 'editor') return; e.preventDefault(); ED.cam.dist = Math.max(25, Math.min(400, ED.cam.dist * (e.deltaY > 0 ? 1.12 : 0.89))); }, { passive: false });
function edKey(e) {
  if (e.ctrlKey || e.metaKey) { if (e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? edRedo() : edUndo(); } else if (e.code === 'KeyY') { e.preventDefault(); edRedo(); } return; }
  if (e.repeat && !['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) return;
  const c = e.code;
  if (c === 'KeyR' || c === 'Space') { e.preventDefault(); ED.rot = (ED.rot + (e.shiftKey ? 3 : 1)) % 4; edPreviewBuild(); edInfo(); }
  else if (c === 'KeyE' || c === 'PageUp') { ED.level++; edRebuild(); edPreviewBuild(); }
  else if (c === 'KeyQ' || c === 'PageDown') { ED.level = Math.max(0, ED.level - 1); edRebuild(); edPreviewBuild(); }
  else if (c === 'KeyX' || c === 'Delete') { if (ED.hover) { const d = ED.del; ED.del = true; edPlace(); ED.del = d; } }
  else if (c === 'KeyG') { ED.fine = !ED.fine; edRebuild(); openEditorBar(); }
  else if (c === 'KeyT') edTest();
  else if (c === 'Escape') { if (ED.del) { ED.del = false; openEditorBar(); } else goMenu(); }
  else if (/^Digit\d$/.test(c)) { const i = (+c.slice(5) + 9) % 10; if (PIECE_ORDER[i]) { ED.sel = PIECE_ORDER[i]; ED.del = false; openEditorBar(); edPreviewBuild(); } }
  else if (c === 'Minus') { ED.sel = PIECE_ORDER[10]; ED.del = false; openEditorBar(); edPreviewBuild(); }
  else if (c === 'Equal') { ED.sel = PIECE_ORDER[11]; ED.del = false; openEditorBar(); edPreviewBuild(); }
}
function updateEditor(dt) {
  const sp = ED.cam.dist * 1.1 * dt;
  if (keys.has('KeyW') || keys.has('ArrowUp')) edPanRaw(0, sp); if (keys.has('KeyS') || keys.has('ArrowDown')) edPanRaw(0, -sp);
  if (keys.has('KeyA') || keys.has('ArrowLeft')) edPanRaw(-sp, 0); if (keys.has('KeyD') || keys.has('ArrowRight')) edPanRaw(sp, 0);
  const c = ED.cam, ty = ED.level * LVL;
  camera.position.set(c.x + Math.sin(c.yaw) * Math.cos(c.pitch) * c.dist, ty + Math.sin(c.pitch) * c.dist, c.z + Math.cos(c.yaw) * Math.cos(c.pitch) * c.dist);
  camera.up.set(0, 1, 0); camera.lookAt(c.x, ty, c.z);
  if (camera.fov !== 55) { camera.fov = 55; camera.updateProjectionMatrix(); }
  placeSun(new THREE.Vector3(c.x, 0, c.z));
  if (edGrid) { const st = ED.fine ? TILE / 2 : TILE; edGrid.position.x = Math.round(c.x / TILE) * TILE + st / 2; edGrid.position.z = Math.round(c.z / TILE) * TILE + st / 2; }
}
function edTest() {
  ED.track.name = $('#edName').value.trim() || 'Meine Strecke';
  const W = buildTrack(ED.track);
  if (!W.start) return toast('⚠️ Setze zuerst einen Start 🚦');
  if (!W.gates.some(g => g.type === 'finish')) return toast('⚠️ Setze ein Ziel 🏁');
  edLeave(); startRace(JSON.parse(JSON.stringify(ED.track)), { test: true });
}
function edSave() {
  ED.track.name = $('#edName').value.trim() || 'Meine Strecke';
  const l = myTracks(); const t = JSON.parse(JSON.stringify(ED.track));
  if (!t.id) t.id = ED.track.id = Date.now().toString(36);
  const i = l.findIndex(x => x.id === t.id); if (i >= 0) l[i] = t; else l.unshift(t);

}
$('#edBack').onclick = goMenu; $('#edUndo').onclick = edUndo; $('#edRedo').onclick = edRedo; $('#edTest').onclick = edTest; $('#edSave').onclick = edSave;
$('#edExport').onclick = () => { ED.track.name = $('#edName').value.trim() || 'Meine Strecke'; codeDialog(encodeTrack(ED.track)); };
$('#edImport').onclick = () => importDialog(tr => { edSnapshot(); ED.track = tr; $('#edName').value = tr.name; $('#edEnv').value = tr.env; $('#edSun').value = tr.sun; edRebuild(true); toast('✅ Importiert'); });
$('#edNew').onclick = () => { if (confirm('Neue Strecke beginnen? (Ungespeichertes geht verloren)')) { edNewTrack(); openEditor(true); } };
$('#edName').oninput = () => { ED.track.name = $('#edName').value; store.set('edDraft', ED.track); };
$('#edEnv').onchange = () => { ED.track.env = $('#edEnv').value; edRebuild(true); };

$('#edUp').onclick = () => { ED.level++; edRebuild(); edPreviewBuild(); };
$('#edDown').onclick = () => { ED.level = Math.max(0, ED.level - 1); edRebuild(); edPreviewBuild(); };
$('#edRot').onclick = () => { ED.rot = (ED.rot + 1) % 4; edPreviewBuild(); edInfo(); };
$('#edDel').onclick = () => { ED.del = !ED.del; openEditorBar(); edPreviewBuild(); };
$('#edFine').onclick = () => { ED.fine = !ED.fine; edRebuild(); openEditorBar(); };
$('#edCamL').onclick = () => { ED.cam.yaw += Math.PI / 4; }; $('#edCamR').onclick = () => { ED.cam.yaw -= Math.PI / 4; };

// ---------- Debug (nur mit #debug in der URL) ----------
const DEBUG = { auto: false };
function autoInput(g) {
  if (!g.cl) { g.cl = []; g.track.pieces.forEach((pl, k) => { let fr = pieceFrames(pl, PIECES[pl.t].guide ? 120 : 24); if (g.track.order && g.track.order[k] === 1) fr = fr.reverse(); g.cl.push(...fr); }); g.idx = 0; }
  const car = g.R.car, cl = g.cl; let bi = g.idx, bd = 1e9;
  for (let i = g.idx; i < Math.min(cl.length, g.idx + 60); i++) { const d = vlen(vsub(cl[i].p, car.p)); if (d < bd) { bd = d; bi = i; } } g.idx = bi;
  const tgt = vsub(cl[Math.min(cl.length - 1, bi + 12)].p, car.p), right = vnorm(vcross(car.f, car.u));
  return { steer: Math.max(-1, Math.min(1, Math.atan2(vdot(tgt, right), vdot(tgt, car.f)) * 3)), throttle: vdot(car.v, car.f) < 34 ? 1 : 0, brake: 0 };
}


// ---------- Hauptschleife ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  try {
    if (mode === 'race' && G) updateRace(dt);
    else if (mode === 'finish' && G) updateRace(dt);
    else if (mode === 'replay' && G) updateReplay(dt);
    else if (mode === 'editor') updateEditor(dt);
    else if (mode === 'garage') updateGarage(dt);
    else updateMenuScene(dt);
  } catch (err) { console.error(err); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
$('#loading').classList.add('hidden');
goMenu();
requestAnimationFrame(frame);
